<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANISO · Ksar Ezzit — Preloader</title>
  <link rel="preconnect" href="https://ksar-ezzit.de" crossorigin />
  <style>
    :root{
      --bg:#0b0e09;
      --gold:#c9a45c;
      --gold-bright:#e7c987;
      --cream:#f3ecdd;
      --olive:#1c2415;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      background:var(--bg);
      color:var(--cream);
      font-family:"Helvetica Neue",Arial,sans-serif;
      overflow-x:hidden;
    }

    /* ===================== PRELOADER ===================== */
    #preloader{
      position:fixed; inset:0; z-index:9999; overflow:hidden;
      background:var(--bg);
      transition:opacity 1.1s ease, visibility 1.1s ease;
    }
    #preloader.done{ opacity:0; visibility:hidden; pointer-events:none; }

    /* --- Couche fond : mosaïque combinée de 25 images --- */
    .collage{
      position:absolute; inset:-6%;
      display:grid;
      grid-template-columns:repeat(8,1fr);
      grid-auto-rows:12.5vh;
      gap:6px;
      filter:sepia(.28) saturate(1.12) contrast(1.04) brightness(.82);
      opacity:.9;
      animation:drift 46s ease-in-out infinite alternate;
      will-change:transform;
    }
    @keyframes drift{
      0%   {transform:scale(1.04) translate3d(0,0,0);}
      100% {transform:scale(1.12) translate3d(-2.5%,-2%,0);}
    }
    .tile{
      position:relative; overflow:hidden; border-radius:3px;
      background:rgba(255,255,255,.02); margin:-3px;
    }
    .tile img{
      width:100%; height:100%; object-fit:cover; display:block; opacity:.92;
      animation:kb 16s ease-in-out infinite alternate; will-change:transform;
    }
    @keyframes kb{
      0%   {transform:scale(1.02) translate3d(0,0,0);}
      100% {transform:scale(1.18) translate3d(2%,-2%,0);}
    }
    .tile.broken{display:none;}

    /* --- Voile sombre --- */
    .veil{
      position:absolute; inset:0;
      background:
        radial-gradient(120% 90% at 50% 45%, rgba(11,14,9,.35) 0%, rgba(11,14,9,.72) 55%, rgba(8,10,6,.92) 100%),
        linear-gradient(180deg, rgba(8,10,6,.55) 0%, rgba(8,10,6,.25) 40%, rgba(8,10,6,.8) 100%);
    }

    /* --- Mot ANISO, FIXE au centre --- */
    .center{
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      text-align:center; width:min(92vw,1000px); z-index:3;
    }
    .wordmark{
      font-family:"Times New Roman",Georgia,serif; font-weight:400;
      font-size:clamp(64px,16vw,200px); line-height:.9;
      letter-spacing:.18em; text-indent:.18em; color:var(--cream);
      text-shadow:0 0 26px rgba(201,164,92,.45), 0 2px 30px rgba(0,0,0,.6);
      display:flex; justify-content:center;
    }
    .wordmark span{
      display:inline-block;
      background:linear-gradient(180deg,#fff6e2 0%,var(--gold-bright) 45%,var(--gold) 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      animation:shine 5.5s ease-in-out infinite;
    }
    .wordmark span:nth-child(2){animation-delay:.3s;}
    .wordmark span:nth-child(3){animation-delay:.6s;}
    .wordmark span:nth-child(4){animation-delay:.9s;}
    .wordmark span:nth-child(5){animation-delay:1.2s;}
    @keyframes shine{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.25);} }

    .rule{ width:min(58%,360px); height:1px; margin:22px auto 16px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent); }

    .subtitle{
      font-size:clamp(10px,1.5vw,14px); letter-spacing:.42em; text-indent:.42em;
      color:rgba(243,236,221,.78); text-transform:uppercase;
    }

    .meter{ margin-top:30px; display:flex; align-items:center; justify-content:center; gap:8px;
      color:var(--gold-bright); font-family:"Times New Roman",Georgia,serif; }
    .counter{ font-size:clamp(20px,3vw,30px); min-width:2.4ch; text-align:right; font-variant-numeric:tabular-nums; }
    .pct{ font-size:clamp(14px,2vw,20px); opacity:.8; }
    .bar{ width:min(40%,220px); height:2px; margin-left:10px; background:rgba(201,164,92,.22);
      overflow:hidden; border-radius:2px; }
    .bar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .25s ease; }

    /* ===================== CONTENU ===================== */
    .hidden{opacity:0;visibility:hidden;transition:opacity 1s ease;}
    #site{
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      text-align:center; padding:24px;
      background:radial-gradient(120% 120% at 50% 0%, #16200f 0%, #0b0e09 60%);
    }
    .hero{max-width:760px;}
    .kicker{ letter-spacing:.4em; text-indent:.4em; font-size:12px; color:var(--gold); text-transform:uppercase; margin-bottom:18px; }
    .hero h1{
      font-family:"Times New Roman",Georgia,serif; font-size:clamp(70px,18vw,180px);
      letter-spacing:.16em; text-indent:.16em; line-height:.9;
      background:linear-gradient(180deg,#fff6e2,var(--gold));
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    .lead{ margin-top:22px; color:rgba(243,236,221,.78); font-size:clamp(14px,2vw,18px); line-height:1.6; }

    @media (prefers-reduced-motion:reduce){
      .collage,.tile img,.wordmark span{animation:none!important;}
    }
  </style>
</head>
<body>
  <!-- ============ PRELOADER ============ -->
  <div id="preloader" aria-hidden="true">
    <div class="collage" id="collage"></div>
    <div class="veil"></div>
    <div class="center">
      <div class="wordmark">
        <span class="a">A</span><span class="n">N</span><span class="i">I</span><span class="s">S</span><span class="o">O</span>
      </div>
      <div class="rule"></div>
      <div class="subtitle">KSAR&nbsp;EZZIT · ORGANIC&nbsp;ESTATE · ZAGHOUAN</div>
      <div class="meter">
        <span class="counter" id="counter">0</span><span class="pct">%</span>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>
  </div>

  <!-- ============ CONTENU (révélé après le preloader) ============ -->
  <main id="site" class="hidden">
    <section class="hero">
      <p class="kicker">DAS FLÜSSIGE GOLD DES MITTELMEERS</p>
      <h1>ANISO</h1>
      <p class="lead">Kraft Olive — Huile d'olive naturelle, née au domaine bio Ksar Ezzit, Zaghouan. Héritage familial depuis 1914.</p>
    </section>
  </main>

  <script>
    /* 25 images du domaine Ksar Ezzit (>= 20) */
    const IMAGES = [
      "https://ksar-ezzit.de/images/hero-open-stone-mill-2026.webp",
      "https://ksar-ezzit.de/images/hero-estate-panorama-2026.webp",
      "https://ksar-ezzit.de/images/olive-harvest-optimized.webp",
      "https://ksar-ezzit.de/images/hero-historic-double-press-2026.webp",
      "https://ksar-ezzit.de/images/hero-villa-kssour-blue-sky-2026.webp",
      "https://ksar-ezzit.de/images/estate-animals-optimized.webp",
      "https://ksar-ezzit.de/images/aniso-hero-gold-crest-transparent-2026.webp",
      "https://ksar-ezzit.de/images/ksar-ezzit-heritage-aniso-edited.webp",
      "https://ksar-ezzit.de/images/hassouna-jdidi-1914.webp",
      "https://ksar-ezzit.de/images/aniso-lassad-together-2026.webp",
      "https://ksar-ezzit.de/images/villa-kssour-2026.webp",
      "https://ksar-ezzit.de/images/villa-huillerie-2026.webp",
      "https://ksar-ezzit.de/images/villa-tabarka-2026.webp",
      "https://ksar-ezzit.de/images/villa-bergerie-2026.webp",
      "https://ksar-ezzit.de/images/les-maison-hammamet-2026.webp",
      "https://ksar-ezzit.de/images/ksar-ezzit-camper-welcome.webp",
      "https://ksar-ezzit.de/images/aniso-car-heritage-2026.webp",
      "https://ksar-ezzit.de/images/olive-tree-heart-2026.webp",
      "https://ksar-ezzit.de/images/aniso-olive-grove-walk-2026.webp",
      "https://ksar-ezzit.de/images/aniso-private-tasting-2026.webp",
      "https://ksar-ezzit.de/images/aniso-bottle-farmer-2026.webp",
      "https://ksar-ezzit.de/images/press-open-air-stone-mill-2026.webp",
      "https://ksar-ezzit.de/images/aniso-kraft-olive-heritage-tree-2026.webp",
      "https://ksar-ezzit.de/images/aniso-private-collection-harvest-2026.jpg",
      "https://ksar-ezzit.de/images/aniso-quality-logistics-2026.webp"
    ];

    const COLS = 8, ROWS = 9, TOTAL_TILES = COLS * ROWS;
    const collage = document.getElementById("collage");
    const counterEl = document.getElementById("counter");
    const barEl = document.getElementById("bar");
    const preloader = document.getElementById("preloader");
    const site = document.getElementById("site");

    function shuffled(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    const order = shuffled(IMAGES);

    for (let i = 0; i < TOTAL_TILES; i++){
      const src = order[i % order.length];
      const tile = document.createElement("div");
      tile.className = "tile";
      const img = document.createElement("img");
      img.loading = "eager"; img.decoding = "async"; img.alt = "";
      img.src = src;
      img.style.animationDelay = (-(i * 0.37)).toFixed(2) + "s";
      img.addEventListener("load", onAsset);
      img.addEventListener("error", () => { tile.classList.add("broken"); onAsset(); });
      tile.appendChild(img);
      collage.appendChild(tile);
    }

    let loaded = 0;
    const total = IMAGES.length;
    const loadedSet = new Set();
    function onAsset(){
      const src = this && this.src ? this.src : null;
      if (src && loadedSet.has(src)) return;
      if (src) loadedSet.add(src);
      targetPct = Math.min(100, Math.round((loadedSet.size / total) * 100));
      if (loadedSet.size >= total) allLoaded = true;
    }

    let targetPct = 0, shownPct = 0, allLoaded = false;
    const MIN_TIME = 2600, MAX_TIME = 9000;
    const start = performance.now();
    counterEl.textContent = "0";

    function tick(now){
      shownPct += (targetPct - shownPct) * 0.08;
      if (targetPct - shownPct < 0.4) shownPct = targetPct;
      const v = Math.round(shownPct);
      counterEl.textContent = String(v);
      barEl.style.width = v + "%";
      const elapsed = now - start;
      const ready = (allLoaded || elapsed > MAX_TIME) && elapsed > MIN_TIME && v >= 100;
      if (ready){ finish(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    let finished = false;
    function finish(){
      if (finished) return;
      finished = true;
      counterEl.textContent = "100";
      barEl.style.width = "100%";
      setTimeout(() => {
        preloader.classList.add("done");
        site.classList.remove("hidden");
        setTimeout(() => { preloader.style.display = "none"; }, 1200);
      }, 350);
    }
  </script>
</body>
</html>
